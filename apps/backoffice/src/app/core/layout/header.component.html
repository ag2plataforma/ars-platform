<!-- Altura propia (h-16), independiente de la barra del logo del sidebar
     (antes ambas compartían h-28 a propósito para que el borde quedara
     alineado -- pedido explícito del usuario, 2026-09-27: el logo creció
     y el header quedó desproporcionadamente alto arrastrado por esa
     igualdad). -->
<header class="flex h-16 items-center justify-between border-b border-slate-200 bg-white px-6 shadow-sm">
  <span class="text-sm font-medium text-slate-500">{{ 'shell.backofficeLabel' | transloco }}</span>
  <div class="flex items-center gap-4">
    <span class="text-sm text-slate-600">{{ userCode() }}</span>
    <p-avatar [label]="userInitial()" shape="circle" styleClass="bg-brand-600 text-white" />
    <button
      pButton
      type="button"
      icon="pi pi-sign-out"
      [text]="true"
      severity="secondary"
      [pTooltip]="'header.logoutTooltip' | transloco"
      tooltipPosition="bottom"
      (click)="logout()"
    ></button>
  </div>
</header>
