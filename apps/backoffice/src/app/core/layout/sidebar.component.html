<nav class="flex flex-col gap-1 overflow-y-auto px-3 py-4">
  @for (item of items(); track item.Orden + item.Titulo) {
    <app-sidebar-nav-item [node]="item" />
  }

  @if (!loading() && items().length === 0) {
    <p class="px-3 pt-4 text-xs leading-relaxed text-slate-500">
      {{ 'sidebar.emptyStatePart1' | transloco }}
      <code class="font-mono">npm run db:seed-menu-config</code>
      {{ 'sidebar.emptyStatePart2' | transloco }}
    </p>
  }
</nav>
