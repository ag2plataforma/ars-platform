<p-toast />

<div class="flex flex-col gap-3">
  <div class="flex justify-end">
    <p-button [label]="'contractDocuments.generateButton' | transloco" icon="pi pi-file-pdf" (onClick)="openGenerate()" />
  </div>

  <p-table [value]="documents()" [loading]="loading()" styleClass="rounded-lg border border-slate-200 text-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>{{ 'contractDocuments.fileColumn' | transloco }}</th>
        <th>{{ 'contractDocuments.dateColumn' | transloco }}</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-doc>
      <tr>
        <td>{{ doc.desFileName }}</td>
        <td>{{ doc.tstRequest | date: 'dd/MM/yyyy HH:mm' }}</td>
        <td>
          <p-button icon="pi pi-download" [text]="true" (onClick)="download(doc)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="py-6 text-center text-sm text-slate-500">{{ 'contractDocuments.emptyState' | transloco }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [visible]="generateDialogVisible()"
  (visibleChange)="!$event && closeGenerate()"
  [modal]="true"
  [style]="{ width: '22rem' }"
  [header]="'contractDocuments.generateDialogTitle' | transloco"
>
  <form [formGroup]="generateForm" class="flex flex-col gap-3">
    <div class="flex flex-col gap-1">
      <label class="text-sm text-slate-600">{{ 'documentTemplates.typeLabel' | transloco }}</label>
      <p-select [options]="templateTypes" optionLabel="label" optionValue="value" formControlName="codTemplateType" appendTo="body" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-sm text-slate-600">{{ 'documentTemplates.roleLabel' | transloco }}</label>
      <p-select [options]="personRoles()" optionLabel="desPersonRol" optionValue="idePersonRol" formControlName="idePersonRol" appendTo="body" />
    </div>
  </form>

  <ng-template pTemplate="footer">
    <p-button [label]="'common.cancel' | transloco" severity="secondary" [text]="true" (onClick)="closeGenerate()" />
    <p-button [label]="'contractDocuments.generateButton' | transloco" [loading]="generating()" (onClick)="submitGenerate()" />
  </ng-template>
</p-dialog>
