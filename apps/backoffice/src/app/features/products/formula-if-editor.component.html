<div class="flex flex-col gap-3">
  <div class="flex items-center gap-2">
    <p-checkbox
      [ngModel]="ifModel().mode === 'always'"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="setAlways($event)"
      [binary]="true"
      inputId="if-always"
    />
    <label for="if-always" class="text-sm text-slate-700">{{ 'products.calculationRules.builder.alwaysLabel' | transloco }}</label>
  </div>

  @if (ifModel().mode !== 'always') {
    <div class="flex flex-col gap-2">
      @for (comparison of ifModel().comparisons; track $index) {
        <div class="flex flex-wrap items-start gap-2 rounded-md border border-slate-200 bg-white p-2">
          <div class="min-w-[14rem] flex-1">
            <app-formula-chain-editor
              [chain]="comparison.left"
              [fieldTokenChoices]="fieldTokenChoices()"
              [ruleChoices]="ruleChoices()"
              [adjustmentChoices]="adjustmentChoices()"
              [rateTableChoices]="rateTableChoices()"
              (chainChange)="setLeft($index, $event)"
            ></app-formula-chain-editor>
          </div>

          <p-select
            appendTo="body"
            [options]="compareOperatorOptions"
            [ngModel]="comparison.op"
            [ngModelOptions]="{ standalone: true }"
            (ngModelChange)="setOperator($index, $event)"
            styleClass="w-20"
          />

          <div class="min-w-[14rem] flex-1">
            <app-formula-chain-editor
              [chain]="comparison.right"
              [fieldTokenChoices]="fieldTokenChoices()"
              [ruleChoices]="ruleChoices()"
              [adjustmentChoices]="adjustmentChoices()"
              [rateTableChoices]="rateTableChoices()"
              (chainChange)="setRight($index, $event)"
            ></app-formula-chain-editor>
          </div>

          <button
            pButton
            type="button"
            icon="pi pi-trash"
            [text]="true"
            severity="danger"
            size="small"
            [disabled]="ifModel().comparisons.length <= 1"
            (click)="removeComparison($index)"
          ></button>
        </div>

        @if (!$last) {
          <div class="pl-2">
            <p-select
              appendTo="body"
              [options]="joinerOptions"
              [ngModel]="ifModel().joiners[$index]"
              [ngModelOptions]="{ standalone: true }"
              (ngModelChange)="setJoiner($index, $event)"
              styleClass="w-24"
            />
          </div>
        }
      }

      <button
        pButton
        type="button"
        icon="pi pi-plus"
        [text]="true"
        size="small"
        [label]="'products.calculationRules.builder.addCondition' | transloco"
        (click)="addComparison()"
      ></button>
    </div>
  }
</div>
